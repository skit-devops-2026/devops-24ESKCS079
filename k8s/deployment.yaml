apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medcare
  template:
    metadata:
      labels:
        app: medcare
    spec:
      containers:
        - name: medcare
          image: ghcr.io/skit-devops-2026/devops-24eskcs079:260d4553a7b21be065ce9d374653b9a2e7180b2c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

