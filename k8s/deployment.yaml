apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medcare
  template:
    metadata:
      labels:
        app: medcare
    spec:
      containers:
        - name: medcare
          image: medcare-medcare:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
