services:

  medcare:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medcare-monitoring
    ports:
      - "8082:80"
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: medcare-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://medcare/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      - medcare

  prometheus:
    image: prom/prometheus:latest
    container_name: medcare-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: medcare-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus