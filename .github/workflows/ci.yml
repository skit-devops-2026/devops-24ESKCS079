
name: CI

on:
  push:
  pull_request:

jobs:
  # M1 — Repository hygiene
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # M3 — Build and automated tests
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Run automated tests
        run: make test

      - name: Build application
        run: make build

  # M4 — Containerization
  docker:
    name: Build and push Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # M5 — Deploy to Render and verify the live application
  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify live deployment
        run: |
          set -eu

          for attempt in $(seq 1 30); do
            HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://devops-24eskcs079.onrender.com/ || true)
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://devops-24eskcs079.onrender.com/health || true)

            echo "Attempt $attempt: homepage=$HOME_STATUS health=$HEALTH_STATUS"

            if [ "$HOME_STATUS" = "200" ] && [ "$HEALTH_STATUS" = "200" ]; then
              echo "Live deployment and health endpoint are responding."
              exit 0
            fi

            sleep 10
          done

          echo "Live deployment did not become healthy within the timeout."
          exit 1
